# fs-tiers.toml — DERIVED, do not hand-edit. Regenerated by smoke-fs-tiers.sh --emit.
# The per-format probe order, DERIVED (design notes §2.1d/e) by reading a corpus
# of edge images through every filesystem package this lab has and grading each
# read byte-for-byte against a foreign host oracle. Correctness first (an eligible
# reader outranks a partial one, which is never first; a wrong reader is disqualified
# by name); cost breaks ties among eligible readers and is UNMEASURED here.

[meta]
derived_by = "smoke-fs-tiers.sh"
corpus_anchor_sha256 = "2c7624860a633074061859939e54a51758881e076de587cd0313ffe41d910d4d"   # sha256(corpus.sha256); the track refuses a stale toml
readers = ["grub2fs", "grubfs"]           # two readers; U-Boot + libsa (§2.1a/b) not built

[readers.grub2fs]
source = "GRUB 2.12 ext2.c/fat.c/iso9660.c/fshelp.c (upstream-grub/, GPLv3 lab-only)"
firmware = "grub2fs-only openbios-unix (GRUB2FS_ONLY=1) — grubfs NOT registered, so a read is unambiguously grub2fs's"

[readers.grubfs]
source = "GRUB 0.97 legacy, vendored in OpenBIOS fs/grubfs/ (CONFIG_FSYS_* per amd64_config.xml)"
firmware = "stock openbios-unix (grubfs-only) — the negative control from POC-2"

[readers.not_built]   # named so this is honestly a TWO-reader table, not a silent omission
uboot = "U-Boot fs/ext4 + fs/fat — design §2.1a, not built in this lab"
libsa = "BSD libsa ufs/cd9660/dosfs — design §2.1b, not built in this lab"

[[format]]
name = "ext2"
corpus = ["ext2-classic", "ext2-modern"]
order = ["grub2fs", "grubfs"]
decided_by = "correctness"
decider_image = "ext2-modern"
grub2fs = "eligible"
grubfs = "partial"
# grubfs is partial: reads some edges, refuses the decider with "File not found" (POC-2: 0.97 cannot traverse a dir_index/256B-inode directory).

[[format]]
name = "fat"
corpus = ["fat16", "fat32", "fat-vfat-long"]
order = ["grub2fs"]
decided_by = "sole-reader"
grub2fs = "eligible"
grubfs = "not-a-reader"
# grubfs refuses FAT here ("Unknown"): CONFIG_FSYS_FAT=false in this repo's amd64 config.
# grubfs CAN read FAT when compiled; a grubfs-with-FAT firmware would make this a real overlap needing Tier 2.

[[format]]
name = "iso"
corpus = ["iso-plain", "iso-rockridge"]
order = ["grub2fs", "grubfs"]
decided_by = "tie-unbroken"
grub2fs = "eligible"
grubfs = "eligible"
# ORDER PROVISIONAL: both readers eligible; the order is NOT decided — it needs
# Tier 2 cost (info blockstats), which is unmeasured. Do not treat as measured.

[tier2_cost]
status = "UNMEASURED"
reason = "Cost is the sector-read count via QEMU 'info blockstats' — the observer OUTSIDE the firmware. The hosted openbios-unix reads a host file directly and has no counted block device, so cost needs the ppc/x86 firmware under QEMU with the monitor (ppc FAT/ISO are separately UNCOVERED — device-path quirk, POC-4)."
