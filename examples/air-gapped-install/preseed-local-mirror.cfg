# Debian 13 "trixie" preseed — INSTALL FROM A LOCAL MIRROR, WITH NO PATH TO THE INTERNET.
#
# This is the debian-preseed-gallery base body with exactly the changes an air-gapped
# install needs, so the diff IS the lesson. Everything not listed under "THE FOUR CHANGES"
# below is the gallery's, unchanged.
#
#   Serve the mirror:   examples/air-gapped-install/airgap.sh serve --bind <lab-ip>
#   Then substitute <lab-ip> for @MIRROR_HOST@ below, or let a renderer do it.
#
# AUTHOR-RUN, and honestly so. `airgap.sh install` proves the mirror serves a complete
# base system offline, in a namespace, in two seconds. This file is the same claim at full
# fidelity — a real d-i netboot install onto a real disk — and it needs three things the
# automated half does not have: a VM on a network with no default route, a DHCP/TFTP/HTTP
# chain to boot it (examples/debian-pxe-lab/ has one), and a FULLER mirror than
# airgap.sh builds. See MANUAL_TESTING.md §3.
#
#   WARNING: plaintext lab credentials (root: lab, user debian: debian). NEVER serve this
#   on an untrusted network.
#
# ─── THE FOUR CHANGES ───────────────────────────────────────────────────────────────────
#
#   1. mirror/http/hostname          -> the lab mirror instead of deb.debian.org
#   2. mirror/http/directory         -> "/" — package-mirror-ram's nginx has
#                                       `root /srv/mirror;`, so dists/ and pool/ sit at the
#                                       server root with no path prefix. airgap.sh builds
#                                       the tree in exactly that layout.
#   3. apt-setup/services-select     -> EMPTY. This is the change that makes it air-gapped
#                                       rather than merely re-pointed: `security, updates`
#                                       sends the installed system to security.debian.org
#                                       and deb.debian.org at first boot. Leave it and the
#                                       install can still succeed while the machine you get
#                                       cannot apt-get anything — the failure lands on
#                                       somebody else, hours later.
#   4. apt-setup/use_mirror etc.     -> no extra sources are added; nothing else is trusted.
#
# THE CHANGE THAT IS NOT HERE, and why. There is no `d-i debian-installer/allow_unauthenticated`
# and no anna/no-verify. A local mirror signed by a local key is the point; switching
# verification off would make this install succeed against a mirror anyone could rewrite,
# which is the opposite of what an air gap is for. The installer must be given the key —
# see MANUAL_TESTING.md §3 for the two ways (a preseed/early_command that drops the key
# into the installer's keyring, or a rebuilt netboot initrd carrying it).

### Localization
d-i debian-installer/locale          string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network
d-i netcfg/choose_interface          select auto
d-i netcfg/get_hostname              string airgap
d-i netcfg/get_domain                string lab
d-i netcfg/hostname                  string airgap
d-i netcfg/dhcp_timeout              string 60
d-i netcfg/link_wait_timeout         string 30
# No DNS is assumed: the mirror is named by IP below, because in an air-gapped lab the
# resolver is one more thing that has to be there and usually is not.

### Mirror — CHANGE 1 and 2: the local mirror, served at the server root.
d-i mirror/country                   string manual
d-i mirror/http/hostname             string @MIRROR_HOST@
d-i mirror/http/directory            string /
d-i mirror/http/proxy                string
d-i mirror/suite                     string trixie

### Clock & time zone
d-i clock-setup/utc                  boolean true
d-i time/zone                        string Etc/UTC
# CHANGE, and it is the one people forget: NTP is a network dependency. An air-gapped
# install that waits for pool.ntp.org stalls for minutes and then carries on, which reads
# as "the installer hung".
d-i clock-setup/ntp                  boolean false

### Accounts — throwaway lab credentials.
d-i passwd/root-login                boolean true
d-i passwd/root-password             password lab
d-i passwd/root-password-again       password lab
d-i passwd/user-fullname             string Debian Lab User
d-i passwd/username                  string debian
d-i passwd/user-password             password debian
d-i passwd/user-password-again       password debian

### Partitioning — the gallery's `regular` variant, atomic recipe.
d-i partman-auto/method              string regular
d-i partman-auto/choose_recipe       select atomic
d-i partman-auto/disk                string /dev/vda
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition         select finish
d-i partman/confirm                  boolean true
d-i partman/confirm_nooverwrite      boolean true

### apt — CHANGE 3 and 4: no upstream services, no extra sources.
d-i apt-setup/cdrom/set-first        boolean false
d-i apt-setup/services-select        multiselect
d-i apt-setup/non-free-firmware      boolean false
d-i apt-setup/contrib                boolean false
d-i apt-setup/non-free               boolean false
popularity-contest popularity-contest/participate boolean false

### Package selection — everything here must exist in the local mirror.
# `standard` is a much larger closure than the 79-package minbase that airgap.sh mirrors;
# see MANUAL_TESTING.md §3 for building a mirror that can satisfy it.
tasksel tasksel/first                multiselect
d-i pkgsel/include                   string openssh-server sudo
d-i pkgsel/upgrade                   select none

### Bootloader
d-i grub-installer/only_debian       boolean true
d-i grub-installer/bootdev           string /dev/vda

### Finish
d-i finish-install/reboot_in_progress note
