# fleet.toml — the Metal-as-a-Service fleet.
#
# TWO roles in one file:
#  1. Hardware spec consumed by create-fleet.sh (libvirt domain shape + BMC port).
#  2. The DECLARED desired end-state consumed by `maas-lab.sh apply` — the
#     reconciliation loop (build step 6, §3a). Increment 1 uses only the hardware
#     fields + [defaults]; the driver/image/[pool] fields are declared now so the
#     spec is stable when `apply` lands.
#
# Fleet = 3 nodes on loopback BMC ports 6230–6232 (F1: never point a BMC at a
# networked host — IPMI-over-LAN is unauthenticated by default).

[defaults]
memory_mb = 4096          # RAM initrds panic under ~2G (virtualbmc-ipmi-lab finding)
disk_size = "10G"
firmware  = "bios"        # SeaBIOS/i440fx, matching the proven vbmc anchor
network   = "vbmc-pxe"    # the PXE NAT net the install/ramdisk drivers use
uri       = "qemu:///system"
bmc_user  = "admin"
bmc_pass  = "password"

[[node]]
name     = "node1"
bmc_port = 6230
# Desired end-state (for `apply`, build step 6). This MUST be what the end-to-end run
# actually deploys, or `apply` spends its first pass undoing the deploy that just
# succeeded — and then the reconciliation invariant ("a second pass issues zero
# transitions") is never reached, because the first pass never converges.
#
# It was `install/almalinux9-ks` and that is exactly what happened: run-e2e.sh phase 8
# put node1 on ramdisk/micro-linux-x86_64, phase 9 read this line, and converged the node
# onto a ~30-minute Anaconda install — the path run-e2e.sh's own header says it
# deliberately avoids. The install then failed and the rollback found a real bug (see
# PLAN.md, the eighth run). The AlmaLinux path is proven end-to-end by
# ../virtualbmc-ipmi-lab/run-finale.sh; what `apply` is here to exercise is the
# reconcile loop, not the installer.
driver   = "ramdisk"
image    = "micro-linux-x86_64"

[[node]]
name     = "node2"
bmc_port = 6231
driver   = "ramdisk"
image    = "busybox-netboot"

[[node]]
name     = "node3"
bmc_port = 6232
driver   = "ramdisk"
image    = "anycast-dns-ram"

[pool]
available = 1             # keep this many wiped + ready (apply, build step 6)
