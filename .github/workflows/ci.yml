name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax check every tracked shell script
        run: |
          rc=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "bash -n FAILED: $f"; rc=1; }
          done < <(git ls-files '*.sh')
          exit $rc
      - name: shellcheck the phase drivers
        # -x follows sourced libs. --severity=warning ignores info-level *style*
        # notes (SC2295/SC2012/SC2015 etc.) that vary by shellcheck version; the
        # three excluded codes are the repo's documented-intentional warnings
        # (validated-name traps, declare+assign, dynamic-scope vars). Fail on any
        # real warning or error.
        run: |
          shellcheck -x --severity=warning -e SC2064,SC2155,SC2034 \
            phase1-chroot/lab-chroot.sh \
            phase2-qemu-vm/lab-vm.sh \
            phase3-docker/lab-docker.sh \
            phase4-podman/lab-podman.sh \
            phase5-lxd/lab-lxd.sh \
            phase7-firecracker/lab-fc.sh

      - name: shellcheck the micro-cloud instruments
        # Same invocation, separate step so the one above keeps its accurate name.
        # These are root-run and CAP_NET_ADMIN-bearing, so a typo here costs more than
        # in a phase driver, not less -- and until now none of them was gated at all.
        run: |
          shellcheck -x --severity=warning -e SC2064,SC2155,SC2034 \
            tools/micro-cloud-preflight.sh \
            tools/micro-cloud-preflight-p2.sh \
            tools/micro-cloud-fabric-probe.sh \
            examples/micro-cloud/fabric.sh \
            examples/micro-cloud/bench-boot.sh \
            examples/micro-cloud/tests/lib.sh \
            examples/micro-cloud/tests/run-all.sh \
            examples/micro-cloud/tests/test-bench-boot.sh \
            examples/micro-cloud/tests/test-fabric-mac-derivation.sh \
            examples/micro-cloud/tests/test-fabric-round-trip.sh \
            examples/micro-cloud/tests/test-edge-on-the-fabric.sh \
            examples/micro-cloud/tests/test-two-engines-one-fabric.sh \
            examples/micro-cloud/tests/test-dhcp-exhaustion.sh \
            examples/micro-cloud/tests/test-vsock-both-engines.sh \
            examples/micro-cloud/tests/test-vsock-chaos.sh \
            examples/micro-cloud/make-vsock-rootfs.sh \
            examples/nested-calico-sandbox/sandbox.sh \
            examples/nested-calico-sandbox/guest-experiment.sh \
            examples/nested-calico-sandbox/tests/lib.sh \
            examples/nested-calico-sandbox/tests/run-all.sh \
            examples/nested-calico-sandbox/tests/test-findings-are-bound.sh \
            examples/nested-calico-sandbox/tests/test-selection-rules.sh \
            examples/nested-calico-sandbox/tests/test-fabric-tap-becomes-candidate.sh \
            examples/kali-packer-vagrant/fetch-kali-packer.sh \
            examples/kali-packer-vagrant/tests/test-offline-archive.sh \
            examples/almalinux-packer-images/fetch-cloud-images.sh \
            examples/almalinux-packer-images/tests/test-offline-archive.sh \
            netboot/build-ipxe.sh \
            netboot/ipxe-build-inner.sh \
            netboot/tests/lib.sh \
            netboot/tests/run-all.sh \
            netboot/tests/test-ipxe-pin.sh

      - name: the EXIT-trap safety net, in every tests/ directory
        # Each phase's run-all.sh already runs its own tests/test-harness-net.sh, but the
        # example labs' suites are not in CI at all -- so without this loop the rule would
        # be enforced only where a suite happens to run. Rootless, seconds, no daemons.
        run: |
          rc=0
          for lib in $(git ls-files '*/tests/lib.sh'); do
            d="$(dirname "$lib")"
            echo "::group::$d"
            bash tools/check-harness-net.sh "$d"; r=$?
            [ "$r" -eq 0 ] || [ "$r" -eq 77 ] || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: no cached host facts in the micro-cloud instruments
        # Pure text analysis, no host state — safe on a runner that has none of these
        # interfaces. Guards the defect class that made one instrument print a fact from
        # 2026-07-29 while running in August: plan §17.4 q6.
        run: bash tools/tests/test-no-cached-host-facts.sh

  docs:
    name: link + learning-path integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Markdown link check (0 broken links — paths AND #anchors)
        run: python3 tools/link_check.py
      - name: the link checker's own negative control
        # 0 broken links is indistinguishable from a checker that looks at nothing. This
        # builds a fixture with 4 deliberate anchor breaks and asserts all 4 are caught,
        # that the 8 legitimate anchors beside them are NOT, and that --no-anchors (the
        # pre-2026-08-05 blindness) reports zero on the same fixture.
        run: bash tools/tests/test-link-check-anchors.sh
      - name: Learning-path routing + freshness gate
        run: python3 tools/paths.py --check

  shell-tests:
    name: shell test suites (daemon/root tests self-skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install jq + tomlq
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          pip install yq            # provides tomlq (needs jq)
      - name: Run every phase's run-all.sh
        # Tests needing docker/podman/incus/root exit 77 (skip); run-all.sh only
        # fails the job on a real FAIL, so the pure-logic tests are the gate here.
        run: |
          rc=0
          # netboot is not a phase, but it now has a run-all.sh and its tests are
          # headless (openssl + a PATH-shimmed docker). Until 2026-08-07 the directory
          # held exactly one test and no runner, so CI ran none of it.
          for d in phase1-chroot phase2-qemu-vm phase3-docker phase4-podman phase5-lxd phase7-firecracker netboot; do
            echo "::group::$d"
            bash "$d/tests/run-all.sh" || rc=1
            echo "::endgroup::"
          done
          # Example-lab guards that are headless (no root, no network, no KVM).
          # These were NOT gated before: the loop above only covers phase*/tests, so the
          # vendored-archive verification could have rotted unnoticed -- which is exactly
          # the class of thing it exists to catch.
          # nested-calico-sandbox: the findings-binding test is headless; the two live ones
          # SKIP without a sandbox VM, which CI cannot build. An unmet precondition is an
          # UNKNOWN, and run-all.sh reports it as a skip rather than a pass.
          for t in examples/kali-packer-vagrant/tests/test-offline-archive.sh \
                   examples/almalinux-packer-images/tests/test-offline-archive.sh \
                   examples/nested-calico-sandbox/tests/run-all.sh; do
            echo "::group::$t"
            bash "$t"; r=$?
            [ "$r" -eq 0 ] || [ "$r" -eq 77 ] || rc=1
            echo "::endgroup::"
          done
          exit $rc

  python-tests:
    name: pytest (phase6 TUI + phase6b web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: phase6-tui pytest
        working-directory: phase6-tui
        run: uv run --frozen pytest -q
      - name: phase6b-web pytest
        working-directory: phase6b-web
        run: uv run --frozen pytest -q
