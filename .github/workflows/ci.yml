name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        # Same treatment as `Install jq + tomlq` below, and for the same reason: shellcheck
        # SHIPS IN THE RUNNER IMAGE, and an unbounded `apt-get update` for a binary already
        # on PATH wedged this job on 2026-08-19 — the second time that day, in the step the
        # first fix did not cover. Fixing one instance of a class leaves the class.
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck already present: $(shellcheck --version | head -2 | tail -1)"
          else
            ok=0
            for attempt in 1 2; do
              if timeout 180 sudo apt-get update && timeout 180 sudo apt-get install -y shellcheck; then
                ok=1; break
              fi
              echo "apt attempt $attempt failed or timed out after 180s"
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::could not install shellcheck after 2 bounded attempts"
              exit 1
            fi
          fi
      - name: Syntax check every tracked shell script
        run: |
          rc=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "bash -n FAILED: $f"; rc=1; }
          done < <(git ls-files '*.sh')
          exit $rc
      - name: shellcheck EVERY tracked shell script
        # TODO 11.3b. This replaced TWO hand-maintained INCLUSION lists (the phase drivers,
        # then the micro-cloud instruments) totalling 60 files out of 516 tracked. A list
        # was doing a job a question should do: a script added tomorrow was gated by nobody
        # unless someone remembered to type its name here.
        #
        # Inverted, with an exclusion file that holds ONE entry -- a vendored upstream
        # script that is not ours to edit. Everything else either got fixed (11.3a: three
        # real defects, 15 live pipe-gated verdicts, 11 unguarded cd) or carries an in-file
        # `# shellcheck disable=<code>  # <reason>`, which lives beside the code it excuses
        # and dies with it. An exclusion list of 39 would have been the inclusion list again.
        #
        # -x follows sourced libs. The three excluded codes are the repo's documented
        # intentional warnings (validated-name traps, declare+assign, dynamic-scope vars).
        #
        # tools/tests/test-shellcheck-gate.sh proves this step's SELECTION and its failure
        # behaviour on planted fixtures -- because an all-PASS sweep and a glob that matched
        # nothing print the same green tick.
        run: |
          # A stale exclusion is a cache entry: it keeps excusing a file that was renamed,
          # and the NEW name is then gated by nobody. Refuse by name.
          mapfile -t excluded < <(grep -vE '^[[:space:]]*(#|$)' .shellcheck-exclude)
          missing=""
          for e in "${excluded[@]}"; do [ -e "$e" ] || missing="$missing $e"; done
          if [ -n "$missing" ]; then
            echo "::error::.shellcheck-exclude names paths that no longer exist:$missing — a stale exclusion keeps excusing a file that moved while its new name is gated by nobody. Update or delete the entry."
            exit 1
          fi
          printf '%s\n' "${excluded[@]}" > /tmp/shellcheck-exclude.list
          mapfile -t files < <(git ls-files '*.sh' | grep -vxF -f /tmp/shellcheck-exclude.list)
          total="$(git ls-files '*.sh' | wc -l)"
          # The ratio, for the same reason run-all.sh prints ran/listed: a step that lints
          # NOTHING and a step that lints everything both exit 0.
          echo "linting ${#files[@]} of $total tracked scripts (${#excluded[@]} excluded — see .shellcheck-exclude)"
          if [ "${#files[@]}" -lt $(( total - 10 )) ]; then
            echo "::error::selection collapsed — ${#files[@]} of $total files. A glob typo would present exactly this way, as a clean pass over almost nothing."
            exit 1
          fi
          shellcheck -x --severity=warning -e SC2064,SC2155,SC2034 -f gcc "${files[@]}"

      - name: shellcheck EVERY tracked test script (errors only)
        # NOW A SUBSET of the step above, and kept deliberately rather than deleted: it is
        # narrower (error severity, no -e exclusions) and would still fire if someone ever
        # widens the exclusion file or relaxes the sweep. Cheap, and it names the corpus it
        # counts. Said out loud here because a redundant step nobody explains is a step
        # someone deletes on the assumption it was covering something.
        # The steps above name individual files, so the ~219 scripts under */tests/ were
        # linted by nobody. That is how two of them carried
        #     # shellcheck disable=SC2034  (reason in a parenthetical)
        # for months: shellcheck parses a directive as key=value pairs, so the trailing
        # text made it emit SC1125 -- an ERROR -- and no gate was looking. (The disable
        # itself still applied, so the suppression worked; the error did not.)
        #
        # ERROR severity, not warning, and that is a deliberate limit rather than an
        # oversight: at --severity=warning the tests currently produce 14 findings
        # (SC2164/SC2154/SC2222/...) which are a separate cleanup, and a gate that starts
        # red is a gate someone disables. At error severity the corpus is at ZERO today,
        # so this fails only on something genuinely new -- and it would have caught the
        # SC1125 above, which is the case that motivated it.
        run: |
          mapfile -t files < <(git ls-files '*/tests/*.sh')
          echo "linting ${#files[@]} test scripts at error severity"
          shellcheck -x --severity=error -f gcc "${files[@]}"

      - name: the shellcheck gate's own control
        # The step above sweeps `git ls-files '*.sh'`. An all-PASS sweep and a glob that
        # matched nothing print the same green tick, and this repo has been burned by that
        # exact shape three times. So the gate ships with its control attached: this seds
        # the SHIPPED step out of ci.yml and runs it against planted fixtures -- a bad
        # script must fail it AND raise its count by one, an exclusion must silence that
        # file, and an exclusion naming a path that no longer exists must fail by name.
        run: bash tools/tests/test-shellcheck-gate.sh

      - name: the EXIT-trap safety net, in every tests/ directory
        # Each phase's run-all.sh already runs its own tests/test-harness-net.sh, but the
        # example labs' suites are not in CI at all -- so without this loop the rule would
        # be enforced only where a suite happens to run. Rootless, seconds, no daemons.
        run: |
          rc=0
          for lib in $(git ls-files '*/tests/lib.sh'); do
            d="$(dirname "$lib")"
            echo "::group::$d"
            bash tools/check-harness-net.sh "$d"; r=$?
            [ "$r" -eq 0 ] || [ "$r" -eq 77 ] || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: no verdict gated on a SIGPIPE-prone pipe into grep -q
        # `producer | grep -q X && fail` skips the assertion entirely when the producer is
        # SIGPIPE'd and `pipefail` is set -- a missed failure reported as a pass. It was live
        # in three teardown assertions ("container still present after destroy") and is the
        # fifth recorded instance of this inversion here. Text analysis, no daemons.
        run: bash tools/tests/test-no-pipe-gates.sh

      - name: every suite runner reports a ratio and names what did not run
        # CLAUDE.md's rule is "print ran/listed, not a bare count". Eight runners printed
        # bare counts anyway, and a comment is not a check. This drives each runner against
        # synthetic pass/fail/skip tests and asserts what it PRINTS -- not what its source
        # looks like, which is the mistake the EXIT-trap checker made twice. It carries its
        # own control: the bare-count shape it replaced must fail the same assertions.
        run: bash tools/tests/test-run-all-reports-a-ratio.sh

      - name: the suite loop tolerates a suite that skips wholesale
        # TODO 11.1. #267 repaired a skip-tolerance that was DEAD CODE: under GitHub's
        # default `bash -e {0}`, `cmd; r=$?` never reaches the assignment, so a suite
        # exiting 77 killed the step and every suite after it silently never ran. The
        # repair has still never executed in production -- no suite has yet exited 77
        # wholesale on a runner -- so the branch that permits it has not been taken here.
        # This takes it deliberately, on every push: it seds the SHIPPED run_suite out of
        # this very file (a re-implementation would drift and then prove something about
        # the copy), drives it under both `bash -e` and `bash -eo pipefail` against
        # synthetic suites exiting 0/77/1, and asserts what the step PRINTS and EXITS.
        # Its control re-injects the pre-#267 shape and requires it to fail the same
        # assertions.
        run: bash tools/tests/test-ci-tolerates-a-skipped-suite.sh

      - name: no cached host facts in the micro-cloud instruments
        # Pure text analysis, no host state — safe on a runner that has none of these
        # interfaces. Guards the defect class that made one instrument print a fact from
        # 2026-07-29 while running in August: plan §17.4 q6.
        run: bash tools/tests/test-no-cached-host-facts.sh

  docs:
    name: link + learning-path integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Markdown link check (0 broken links — paths AND #anchors)
        run: python3 tools/link_check.py
      - name: the link checker's own negative control
        # 0 broken links is indistinguishable from a checker that looks at nothing. This
        # builds a fixture with 4 deliberate anchor breaks and asserts all 4 are caught,
        # that the 8 legitimate anchors beside them are NOT, and that --no-anchors (the
        # pre-2026-08-05 blindness) reports zero on the same fixture.
        run: bash tools/tests/test-link-check-anchors.sh
      - name: Learning-path routing + freshness gate
        run: python3 tools/paths.py --check

  shell-tests:
    name: shell test suites (daemon/root tests self-skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install jq + tomlq
        # `jq` SHIPS IN THE RUNNER IMAGE, and this step used to `apt-get update` anyway.
        # On 2026-08-19 that unconditional update wedged THREE separate runs — 8+ minutes
        # each on a mirror that never answered, holding the whole job open with no output
        # and no timeout, to install a binary that was already on PATH. A cancel-and-rerun
        # hit it again immediately, so it is a reproducible failure mode rather than a
        # one-off, and "re-run it" is not a fix for something that reappears on demand.
        #
        # So: ask whether the tool is there before reaching for the network, and when it
        # genuinely is not, bound the attempt. An unbounded install is not more reliable
        # than a bounded one — it just fails later, as a timeout on the whole job, with the
        # cause buried under every step that never got to run.
        run: |
          if command -v jq >/dev/null 2>&1; then
            echo "jq already present in the runner image: $(jq --version) — no apt needed"
          else
            ok=0
            for attempt in 1 2; do
              if timeout 180 sudo apt-get update && timeout 180 sudo apt-get install -y jq; then
                ok=1; break
              fi
              echo "apt attempt $attempt failed or timed out after 180s"
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::could not install jq after 2 bounded attempts"
              exit 1
            fi
          fi
          pip install yq            # provides tomlq (needs jq)
      - name: Install the disk-image toolchain (so phase 5's VM-backend test RUNS, not SKIPs)
        # `phase5-lxd/tests/test-vm-image-build.sh` builds a real MBR/extlinux disk image
        # and is the ONLY coverage of `backend_from_chroot_vm` / `backend_from_tarball_vm`
        # — code that had never executed anywhere until 2026-08-16, and that turned out to
        # carry two defects (a GNU-tar option that does not exist, and errexit suppressed
        # inside `( … ) || die`).
        #
        # Measured on PR #220: without these it reported `SKIP: missing required command:
        # qemu-img` and the job printed a clean 0 failed. `syslinux-common` supplies the
        # mbr.bin the test compares byte-for-byte; `extlinux` supplies the installer.
        # The verify line below names what is missing rather than letting the skip be
        # discovered by reading a log later.
        run: |
          # BOUNDED. These packages are genuinely not in the runner image, so the install is
          # real -- but an install with no deadline does not fail, it hangs, and the cause
          # then arrives as a timeout on the whole job with every later step unrun.
          timeout 300 sudo apt-get install -y qemu-utils parted extlinux syslinux-common rsync e2fsprogs \
            || echo "::warning::disk-image toolchain install failed or timed out — phase 5's VM-backend test will SKIP"
          missing=""
          for c in qemu-img parted mkfs.ext4 losetup extlinux rsync blkid; do
            command -v "$c" >/dev/null 2>&1 || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "::warning::still missing:$missing — phase 5's VM-backend test will SKIP, so the disk-image build is NOT exercised by this run"
          else
            echo "disk-image toolchain present — phase 5's VM-backend test will run"
          fi
      - name: Allow unprivileged user namespaces (so the mount tests RUN, not SKIP)
        # Two phase-1 tests create a bind mount to exercise the H1 rm -rf guard. A bind
        # needs CAP_SYS_ADMIN only in the namespace doing the mounting, so they re-exec
        # into `unshare -rm` rather than being root-gated — a root-gated test SKIPs on
        # every CI run, which is how the guard it protects goes unwatched.
        #
        # But Ubuntu 24.04 ships kernel.apparmor_restrict_unprivileged_userns=1, which
        # denies unprivileged userns to unconfined binaries — so on the runner they
        # SKIPped anyway, silently swapping one unwatched guard for another. Measured on
        # PR #199: both printed "needs unprivileged user namespaces (unshare -rm) or root"
        # while passing locally.
        #
        # `|| true`: the knob is Ubuntu/AppArmor-specific and absent elsewhere; if it
        # cannot be relaxed the tests still self-skip with a named reason rather than
        # failing the job. The verify line below prints which way it went, so a future
        # runner-image change that re-blocks this is visible in the log instead of
        # quietly turning two tests back into skips.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          if unshare -rm true 2>/dev/null; then
            echo "unprivileged user namespaces: AVAILABLE — the mount-guard tests will run"
          else
            echo "::warning::unprivileged user namespaces unavailable — phase-1 mount-guard tests will SKIP, so the H1 rm -rf guard is NOT exercised by this run"
          fi
      - name: Make /dev/kvm usable if this runner has one
        # Same shape, same reason, for Phase 7. `lab-fc.sh create` gates on /dev/kvm being
        # read-write — a real gate about the host, correctly refusing to build an instance
        # the host cannot boot. The consequence is that seven phase-7 tests need it, none
        # of which boots anything: they exercise the CONFIG GENERATOR, the record, and the
        # lifecycle verbs against a stand-in VMM.
        #
        # Measured on PR #216: this runner's /dev/kvm is not read-write for the runner uid,
        # so those seven SKIPped and the escaping, record and lifecycle guards were not
        # exercised by CI at all — while the job printed a clean 0 failed. The warning below
        # exists so that state is visible in the log instead of being invisible in a count.
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm 2>/dev/null || true
            sudo setfacl -m "u:$(id -u):rw" /dev/kvm 2>/dev/null || true
          fi
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            echo "/dev/kvm: read-write for uid $(id -u) — the phase-7 create-path tests will run"
          elif [[ -e /dev/kvm ]]; then
            echo "::warning::/dev/kvm exists but is not read-write for uid $(id -u) — 7 phase-7 tests will SKIP, so the config-generator escaping, record-encoding and lifecycle guards are NOT exercised by this run"
          else
            echo "::warning::/dev/kvm is absent on this runner — 7 phase-7 tests will SKIP, so the config-generator escaping, record-encoding and lifecycle guards are NOT exercised by this run"
          fi
      - name: Install qemu-system (so phase 2's argv unit tests RUN, not SKIP)
        # TODO 11.2a. Measured from the annotation on 1c756a6: phase 2 skipped 12 of its
        # rows on this runner, and NINE of them are gated on a qemu-system binary merely
        # EXISTING -- they source `build_qemu_argv` and assert the argv it renders. Nothing
        # here boots: without /dev/kvm the generator simply renders tcg, which is a
        # different assertion, not a broken one.
        #
        # Two packages, deliberately: seven rows need only `qemu-system-x86_64`, and
        # `test-microvm-argv.sh` also requires `qemu-system-aarch64` (a separate package)
        # because the microvm/virt split is the thing it exists to check. The ninth,
        # `test-debian-x86_64-boot.sh`, will STILL skip -- it needs /dev/kvm, socat, curl
        # and an ISO maker, and booting Debian under TCG is not worth a runner's minutes.
        #
        # THE PRICE, stated because §11.2a asks for it: ~120 MB and roughly a minute of
        # install, once per run of this job, to move eight rows from UNKNOWN to measured.
        # The three MAAS rows the same binary appears to gate are NOT bought by this: each
        # needs more behind it (ukify+swtpm+mtools+OVMF; a ROM built with docker; a staged
        # netboot kernel), which the earlier tally missed by reading only the FIRST missing
        # command in each skip line.
        #
        # `xorriso` rides along (a few MB) for a different row: test-seed-and-sha256.sh
        # skipped with "no ISO maker", and unlike the argv rows its SUBJECT is the NoCloud
        # seed ISO, so the tool is a genuine precondition there rather than incidental
        # machinery. That distinction is not academic -- it is exactly what the first run
        # of this step turned up: test-mac-cli.sh had quietly depended on an ISO maker it
        # has no opinion about, and announced the absence as a regression in `--mac`.
        run: |
          timeout 300 sudo apt-get install -y qemu-system-x86 qemu-system-arm xorriso \
            || echo "::warning::qemu-system install failed or timed out — phase 2's argv unit tests will SKIP, so build_qemu_argv is NOT exercised by this run"
          missing=""
          for c in qemu-system-x86_64 qemu-system-aarch64 xorrisofs; do
            command -v "$c" >/dev/null 2>&1 || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "::warning::still missing:$missing — the phase-2 rows gated on it will SKIP, and the end-of-step annotation will name each one"
          else
            echo "qemu-system present ($(qemu-system-x86_64 --version | head -1)) — phase 2's argv unit tests will run"
          fi
      - name: Run every phase's run-all.sh
        # Tests needing docker/podman/incus/root exit 77 (skip); run-all.sh only
        # fails the job on a real FAIL, so the pure-logic tests are the gate here.
        #
        # A GREEN TICK HERE DOES NOT SAY WHICH ROWS RAN, and that is not a small gap:
        # measured on 21a5aea, micro-cloud reported `11 passed, 12 SKIPPED, 0 failed` on
        # this runner against `17 passed, 6 skipped` on the author's box. Both are green.
        # Every runner in this repo already NAMES its skipped files (CLAUDE.md: "an unmet
        # precondition is an UNKNOWN, and it has to be legible as one") -- but it names
        # them inside a collapsed ::group::, where nobody looks at a passing job. So
        # `run_suite` below re-surfaces them as ONE annotation at the end of the step:
        # the count is the runner's to keep, and the annotation says which guards were
        # not exercised by THIS run.
        run: |
          rc=0
          skipped_report=""
          # Run one suite: stream its output, capture its status WITHOUT letting errexit
          # abort the step, and remember any files it named as skipped.
          #
          # `bash "$t" || r=$?` and NOT `bash "$t"; r=$?`. GitHub's default shell is
          # `bash -e {0}`, and under errexit the second form never reaches the assignment
          # -- the step dies with the raw status instead. That is how the previous
          # `[ "$r" -eq 77 ] || rc=1` tolerance came to be DEAD CODE: a suite that exited
          # 77 (a skip this line exists to permit) killed the step before the test that
          # permits it could run, and the remaining suites in the loop never ran at all.
          # Never observed because none of them has yet exited non-zero here. Measured
          # 2026-08-21: `bash -e -o pipefail -c 'f(){ return 77; }; f; r=$?; echo reached'`
          # prints nothing and exits 77.
          run_suite() {
            local label="$1" cmd="$2" log r=0
            log="$(mktemp)"
            echo "::group::$label"
            bash "$cmd" > "$log" 2>&1 || r=$?
            cat "$log"
            echo "::endgroup::"
            [ "$r" -eq 0 ] || [ "$r" -eq 77 ] || rc=1
            # %0A is how a workflow command encodes a newline in an annotation, and it
            # keeps this on ONE line -- a literal newline here would be a shallower line
            # inside a YAML block scalar, which silently ends the block. awk rather than
            # `grep -v` because an assignment takes the status of its command
            # substitution, and under errexit a grep that matches nothing would abort the
            # step from inside a string.
            if grep -q '^skipped — these did NOT run' "$log"; then
              skipped_report="$skipped_report%0A  $label: $(awk '/^skipped — these did NOT run/{f=1;next} /^failed:/{f=0} f && NF {printf "%s ", $1}' "$log")"
            fi
            rm -f "$log"
          }
          # netboot is not a phase, but it now has a run-all.sh and its tests are
          # headless (openssl + a PATH-shimmed docker). Until 2026-08-07 the directory
          # held exactly one test and no runner, so CI ran none of it.
          for d in phase1-chroot phase2-qemu-vm phase3-docker phase4-podman phase5-lxd phase7-firecracker netboot; do
            run_suite "$d" "$d/tests/run-all.sh"
          done
          # Example-lab guards that are headless (no root, no network, no KVM).
          # These were NOT gated before: the loop above only covers phase*/tests, so the
          # vendored-archive verification could have rotted unnoticed -- which is exactly
          # the class of thing it exists to catch.
          # nested-calico-sandbox: the findings-binding test is headless; the two live ones
          # SKIP without a sandbox VM, which CI cannot build. An unmet precondition is an
          # UNKNOWN, and run-all.sh reports it as a skip rather than a pass.
          # micro-cloud: SHELLCHECKED SINCE SLICE 3 AND NEVER RUN, which is the same gap as
          # "a test with no runner" one level up -- and it mattered the moment slice 7's
          # preserve gate was written to need no engine and no root SPECIFICALLY so it could
          # run here. Most of this suite is root-gated and will skip, by name.
          # metal-as-a-service: ADDED 2026-08-21, and it had never been gated AT ALL -- the
          # largest suite in the repo (39 tests, headless BY CONSTRUCTION: a mock BMC, a
          # mock deploy driver and real crypto, so the whole Ironic-faithful lifecycle
          # drives with no libvirt, no vbmcd and no root). It is the lab whose own
          # DEFERRED.md is about what a green run cannot prove, and nothing was proving
          # even the green part. What made the gap concrete: the audit in 21a5aea found a
          # README quickstart command that had never worked at any commit, fixed it, and
          # added tests/test-inspect-facts-from-a-stream.sh to stop it regressing -- a
          # regression guard that, until this line, no automated run would ever execute.
          # It costs ~11 minutes, which is the honest price of the largest suite here.
          for t in examples/kali-packer-vagrant/tests/test-offline-archive.sh \
                   examples/almalinux-packer-images/tests/test-offline-archive.sh \
                   examples/micro-cloud/tests/run-all.sh \
                   examples/nested-calico-sandbox/tests/run-all.sh \
                   examples/metal-as-a-service/tests/run-all.sh; do
            run_suite "$t" "$t"
          done
          # ONE annotation, not one per suite: GitHub displays only the first handful of
          # annotations of a given type per step, and a truncated list of what did not run
          # is its own kind of lie.
          if [ -n "$skipped_report" ]; then
            echo "::warning::Suites that SKIPPED rows on this runner — an unmet precondition is an UNKNOWN, not a pass, so these guards were NOT exercised by this run:$skipped_report"
          fi
          exit $rc

  python-tests:
    name: pytest (phase6 TUI + phase6b web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Provide a container engine for the LIVE reconcile rows
        # phase6-tui/tests/test_apply_live.py drives a REAL engine: it is the only
        # thing that proves apply's no-op-on-pass-two property against something
        # that can disagree with it (a fake converges because the fixture says so),
        # and it carries slice 6's break-it row. It refuses to pull over the network
        # itself — on a developer's box that would be a surprise — so CI, where a
        # pull is unremarkable, provides the image instead.
        #
        # A ::warning:: on every failure branch, because the alternative is a green
        # tick that silently means "the live rows did not run". That distinction is
        # the whole reason the suite skips loudly rather than passing quietly.
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            echo "::warning::podman is absent on this runner — phase6-tui's 4 live reconcile/apply rows will SKIP, so the no-op-on-pass-two property against a real engine, the started-not-recreated repair, and slice 6's cross-lab identity row are NOT exercised by this run"
            exit 0
          fi
          podman --version
          if ! podman pull -q docker.io/library/busybox:latest; then
            echo "::warning::could not pull busybox — phase6-tui's 4 live reconcile/apply rows will SKIP (see above for what that leaves unexercised)"
          fi
      - name: phase6-tui pytest
        working-directory: phase6-tui
        # -rs NAMES every skip in the job log. A count cannot say WHICH guard did
        # not run, and this suite's skips are exactly the rows whose absence would
        # otherwise be invisible behind a green tick.
        run: uv run --frozen pytest -q -rs
      - name: phase6b-web pytest
        working-directory: phase6b-web
        run: uv run --frozen pytest -q -rs
