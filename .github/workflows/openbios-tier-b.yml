# openbios Tier B — build the firmware and boot it.
#
# TODO §14 Tier B. This began as `workflow_dispatch` and nothing else, because the
# decision it informs was a COST decision and nobody had the number. MEASURED
# 2026-08-27 (run 33115835118, cold ubuntu-latest, podman present, no KVM):
# 3m11s wall — 56s to build all three firmwares from nothing (the container image,
# which compiles `toke` from source, is inside the 37s x86 number) and 92s to boot
# seven tracks under TCG. The guess had been ~10 min.
#
# It now runs PER PULL REQUEST, path-filtered, plus a weekly backstop. Three
# minutes is not a nightly-only cost, and the argument stopped being about minutes:
# Tier B has found TWO defects invisible to every green run — a marker string that
# was already in the pristine upstream file, and a build applying 1 of 34 patches —
# and both were visible only from a cold checkout. A nightly reports those the next
# morning against a merged main, so you start from "something on main is broken"
# and bisect; per-PR reports them against the one diff that caused them.
#
# THE GATE MATTERS MORE THAN THE MINUTES. Every track in smoke-openbios.sh guards
# on a built artifact and SKIPs without one, so a Tier B job that cannot build
# produces a full sweep of SKIPs and a green tick — the exact shape §14 measured
# and this repo keeps re-finding. So the "did the build actually happen" step
# below FAILS; it does not skip, and it does not let the tracks run to produce a
# reassuring row of 77s.
#
# What it cannot do, stated rather than discovered later: ubuntu-latest has no
# KVM, so every boot is TCG. Timings here are therefore an UPPER bound for any
# runner with nested virt, and the right bound for the runners this repo uses.
name: openbios Tier B

on:
  # NOT `on.pull_request.paths`. A workflow-level path filter stops the run from
  # happening at all on a non-matching PR, so a REQUIRED status check never reports
  # and the PR blocks forever waiting on something that will never arrive. The
  # filtering happens in the `changes` job below instead, so `gate` always reports.
  pull_request:
  schedule:
    # The weekly backstop. The path filter is a cached fact about what Tier B
    # depends on, and a wrong one is SILENT — a PR that skips Tier B looks exactly
    # like a PR that did not need it. This bounds a miss at a week.
    # tools/tests/test-openbios-tier-b-relevance.sh re-derives the filter from this
    # file's own entry points; the backstop is what covers what it cannot derive.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      tracks:
        # NO `default:` HERE ON PURPOSE. The default list lives once, in
        # DEFAULT_TRACKS below, because a default repeated in two places is a
        # cached fact that drifts — and on `pull_request` and `schedule` there is
        # no `inputs` at all, so the job needs the fallback regardless.
        description: tracks to run, space separated (blank = DEFAULT_TRACKS below)
        required: false

permissions:
  contents: read

env:
  # struct-layer joined 2026-08-29 (REVIEW G2), struct-array and struct-device
  # 2026-08-30. They earn default slots where the other recent tracks did not:
  # they need exactly the four x86/amd64 artifacts the gate above already
  # requires, and an unrun test rots. struct-device is the costliest of the three
  # (three boots and a screendump) and is here anyway, because it carries the
  # regression guard for patch 49 — the six 1275 device-register words that
  # shipped EMPTY, whose failure mode is a silent stack shift in an FCode driver.
  DEFAULT_TRACKS: multiboot dict-identity amd64 property-abi diagnostics vga ppc struct-layer struct-array struct-device elf-methods rmw-fields tlv-primitives

jobs:
  # Cheap, ~15s, and always runs: it is what lets `gate` report on every PR.
  changes:
    name: does this change touch the firmware?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the base commit has to be present to diff against
      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != pull_request ]]; then
            echo "event is '$EVENT', not a pull request — Tier B runs unconditionally"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Not piped into the decider: `a | b` reports b's status, and this repo
          # merged a red PR that way once. The list goes to a file, then the
          # decider reads it and its own rc is the one that is checked.
          git diff --name-only "$BASE" "$HEAD_SHA" > /tmp/changed-files
          echo "changed files:"; sed 's/^/  /' /tmp/changed-files
          r="$(tools/openbios-tier-b-relevant.sh < /tmp/changed-files)"
          echo "relevant=$r" >> "$GITHUB_OUTPUT"
          echo "Tier B relevant: $r"

  tier-b:
    name: build + boot (TCG)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: What this runner can actually do
        # TO STDOUT AS WELL AS THE SUMMARY. The first version wrote only to
        # $GITHUB_STEP_SUMMARY, which is not in the job log — so when the build
        # failed, the log could not say whether podman had even been present. A
        # diagnostic that is invisible in the artifact you read when things go
        # wrong is not a diagnostic.
        run: |
          set -u
          { echo "## Tier B environment"; } | tee -a "$GITHUB_STEP_SUMMARY"
          for c in podman qemu-system-i386 qemu-system-x86_64 qemu-system-ppc genisoimage python3; do
            if command -v "$c" >/dev/null 2>&1; then
              printf -- '- `%s` present (%s)\n' "$c" "$(command -v "$c")" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              printf -- '- `%s` **MISSING**\n' "$c" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [[ -w /dev/kvm ]]; then
            echo "- /dev/kvm writable — boots use KVM" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "- no /dev/kvm — **every boot is TCG**, so these timings are an upper bound" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          podman version 2>&1 | head -5 || true

      - name: Install what the tracks need
        run: |
          set -u
          # Bounded like every other install step in ci.yml: a hung apt must not
          # eat the runner's hour, and a failed one must be visible rather than
          # turning into a sweep of SKIPs two steps later.
          timeout 180 sudo apt-get update || echo "::warning::apt-get update failed"
          timeout 300 sudo apt-get install -y qemu-system-x86 qemu-system-ppc genisoimage \
            || echo "::warning::install failed — the artifact gate below will say what that cost"

      - name: Build x86, amd64 and ppc
        id: build
        # `if ! cmd; then` AND NOT `cmd; rc=$?`. GitHub runs `run:` under
        # `/usr/bin/bash -e {0}`, so -e is in force whether or not the script asks
        # for it: a bare failing command aborts the step BEFORE the next line, and
        # the `rc=$?` capture below never happened. The first run died 20 seconds
        # in having printed none of the build output it was written to print — the
        # diagnostic was unreachable for the same reason the failure was.
        #
        # A command inside an `if` condition is exempt from -e, which is the whole
        # fix. Same family as CLAUDE.md's "never pipe a command whose exit status
        # is the gate": the shell was answering a different question than the one
        # the script asked.
        run: |
          set -u
          cd examples/openbios-the-rival-that-shipped
          : > /tmp/tierb-times
          # unix BEFORE amd64: both build into obj-amd64 (unix-amd64 and amd64 are
          # separate switch-arch targets sharing the dir), and build-openbios.sh's
          # `all` proves the unix→amd64 order leaves BOTH openbios-unix and
          # openbios.multiboot present. The reverse order is untested, so don't use
          # it. unix is here for the tlv-primitives track's four-arch matrix (F10).
          for a in x86 ppc unix amd64; do
            s=$(date +%s)
            rc=0
            if ! timeout 3000 ./build-openbios.sh "$a" > "/tmp/build-$a.log" 2>&1; then
              rc=$?
            fi
            e=$(date +%s)
            printf 'build:%s %ss rc=%s\n' "$a" "$((e - s))" "$rc" >> /tmp/tierb-times
            # PRINTED ON EVERY PATH, not only on failure. The first run that got
            # this far reported rc=0 in zero seconds having built nothing, and the
            # log that would have said why was written to a file this step only
            # showed when rc was non-zero. A diagnostic gated on the failure you
            # expected is no diagnostic for the one you did not.
            echo "--- last lines of build-$a.log (rc=$rc) ---"
            tail -12 "/tmp/build-$a.log" || true
            if (( rc != 0 )); then
              echo "--- fuller tail (rc=$rc) ---"
              tail -40 "/tmp/build-$a.log" || true
              { echo; echo "### build $a FAILED (rc=$rc)"; echo '```';
                tail -40 "/tmp/build-$a.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
            fi
          done
          cat /tmp/tierb-times

      - name: The artifact gate — FAIL, never skip
        # `always()`, AND THAT IS THE POINT OF THE STEP. On the first run the build
        # step failed, so GitHub's default `if: success()` SKIPPED this gate — the
        # one step written specifically to refuse a silent skip was itself silently
        # skipped. The job still went red, so nothing was falsely green; but the
        # message explaining what a missing artifact means never printed, and a
        # build that "succeeded" while producing nothing would have sailed past a
        # gate that only runs when everything already worked.
        if: always()
        run: |
          set -u
          W="${OPENBIOS_WORKDIR:-$HOME/openbios-lab}/openbios"
          missing=()
          for f in obj-x86/openbios.multiboot obj-x86/openbios-x86.dict \
                   obj-amd64/openbios.multiboot obj-amd64/openbios-amd64.dict \
                   obj-amd64/openbios-unix obj-amd64/openbios-unix.dict \
                   obj-ppc/openbios-qemu.elf; do
            [[ -f "$W/$f" ]] || missing+=("$f")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Tier B produced no firmware: ${missing[*]}"
            echo "Every smoke track guards on a built artifact and SKIPs without one, so"
            echo "letting the tracks run from here would print a sweep of 77s and a green"
            echo "tick. That is the failure mode this gate exists to prevent."
            exit 1
          fi
          echo "all five artifacts present"

      - name: Boot the tracks
        env:
          # Through the ENVIRONMENT, never interpolated into the script body: a
          # `${{ }}` expansion is pasted in as source before bash sees it, so a
          # dispatch input containing shell would run as this job. Low stakes for a
          # collaborator-only manual trigger, and still not a habit worth having.
          TRACKS: ${{ inputs.tracks }}
        run: |
          set -u
          # `inputs` exists only on workflow_dispatch, so on a pull_request or the
          # weekly run TRACKS arrives EMPTY — and an empty `for` list runs zero
          # tracks, prints no failure and exits 0. That is this repo's oldest shape:
          # a checker that looks at nothing prints the same tick as one that passes.
          # Hence the fallback AND the count check at the end; either alone is a
          # half measure, since a typo could still leave the list empty.
          [[ -n "${TRACKS// /}" ]] || TRACKS="$DEFAULT_TRACKS"
          cd examples/openbios-the-rival-that-shipped
          rc=0
          ran=0
          for t in $TRACKS; do
            # ...and validated, so a typo names itself instead of reaching smoke-openbios.sh
            # as an argument it will reject far less legibly.
            [[ "$t" =~ ^[a-z0-9][a-z0-9-]*$ ]] \
              || { echo "::error::refusing track name '$t' — expected [a-z0-9-]"; exit 1; }
            s=$(date +%s)
            timeout 1200 ./smoke-openbios.sh "$t" > "/tmp/track-$t.out" 2>&1; r=$?
            e=$(date +%s)
            printf 'track:%s %ss rc=%s\n' "$t" "$((e - s))" "$r" >> /tmp/tierb-times
            tail -1 "/tmp/track-$t.out"
            # A SKIP here is not a pass. The artifacts exist by now, so a 77 means
            # the track wanted something else — say so rather than counting it green.
            case $r in
              0) ;;
              77) echo "::warning::$t SKIPPED after a successful build — it needs something this runner lacks" ;;
              *) rc=1 ;;
            esac
            ran=$((ran + 1))
          done
          if (( ran == 0 )); then
            echo "::error::no tracks ran — TRACKS was empty after the fallback, so this job proved nothing"
            exit 1
          fi
          echo "$ran track(s) ran"
          exit $rc

      - name: Timings
        if: always()
        run: |
          set -u
          {
            echo "## Tier B timings"
            echo
            echo '```'
            cat /tmp/tierb-times 2>/dev/null || echo "(none recorded)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/tierb-times 2>/dev/null || true

  # THE ONE TO MARK REQUIRED IN BRANCH PROTECTION.
  #
  # It runs on every pull request, including ones that skip Tier B entirely, which
  # is the whole reason the filtering happens in `changes` rather than in
  # `on.pull_request.paths`. Its logic lives in a script so it can be driven
  # directly by tools/tests/test-openbios-tier-b-relevance.sh §2 — a gate observed
  # only on its happy path is indistinguishable from `exit 0`, and this one is
  # default-deny: the two known-good combinations pass and everything else, an
  # unfinished relevance job included, refuses.
  gate:
    name: Tier B gate
    needs: [changes, tier-b]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Decide
        run: |
          tools/openbios-tier-b-gate.sh \
            '${{ needs.changes.result }}' \
            '${{ needs.changes.outputs.relevant }}' \
            '${{ needs.tier-b.result }}'
